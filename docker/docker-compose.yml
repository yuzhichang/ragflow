include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      # The mode-8 engine dials the shared Codex app-server lazily; start it first so the
      # first mode-8 turn does not race the container coming up.
      codex:
        condition: service_started
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # MCP is served in-process by the API server (POST /mcp on the 9380 port).

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --init-superuser
      #- --init-model-provider-tables
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      # - ${RAGFLOW_SSH_KNOWN_HOSTS:-${HOME}/.ssh/known_hosts}:${SSH_KNOWN_HOSTS:-/etc/ragflow/ssh_known_hosts}:ro
    env_file: .env
    # Route the Go services' cache/queue backend to the separate Kvrocks service.
    # The Python services use the Valkey `redis` service, which the Go deployment
    # disables (see the `redis` profile override above). KVROCKS_HOST/KVROCKS_PORT
    # are the IN-NETWORK coordinates the Go process uses to reach `kvrocks:6379`; the
    # host-published port is KVROCKS_PORT (see docker-compose-base.yml), which CI
    # offsets per job and keeps distinct from REDIS_PORT.
    environment:
      - KVROCKS_HOST=kvrocks
      - KVROCKS_PORT=6379
      # The WS capability token that authenticates this process to the codex service.
      # It is mapped from CODEX_WS_TOKEN (the codex service's own entrypoint reads the
      # same variable) so a single value in .env is the source of truth. Empty means
      # mode 8 is unusable (the codex container also refuses to start without it).
      - RAGFLOW_CODEX_BEARER_TOKEN=${CODEX_WS_TOKEN:-}
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Shared Codex app-server backing the mode-8 engine. Always on with the stack: the API
  # reaches it over the compose network at ws://codex:8790, and it calls back into this
  # API's MCP bridge. See docker/codex/ and the README "Codex app-server" section.
  #
  # Runs the published image (infiniflow/codex:<version>, set via CODEX_IMAGE). To build
  # it locally instead, run ./codex/download_deps.py and then
  # `docker build -t infiniflow/codex:${CODEX_VERSION} ./codex`.
  codex:
    image: ${CODEX_IMAGE}
    environment:
      # The entrypoint writes this into the token file the app-server reads (the CLI
      # does not take the token from an env var). Must match the API's
      # RAGFLOW_CODEX_BEARER_TOKEN, which is mapped from the same variable above.
      # Only this variable is passed in — the container gets no other stack secrets.
      - CODEX_WS_TOKEN=${CODEX_WS_TOKEN:-}
    # Publish to the host's loopback only, for local diagnosis (e.g. a WS client at
    # ws://127.0.0.1:${CODEX_WS_PORT}). Inside the container the server binds 0.0.0.0 so
    # the API container can reach it over the compose network.
    ports:
      - "127.0.0.1:${CODEX_WS_PORT:-8790}:8790"
    volumes:
      # Persist the Codex thread/rollout state so a container restart does not force the
      # engine to rebuild every thread. The volume is seeded from the image (owned by the
      # unprivileged `codex` user), so no host-side chown is needed.
      - codex-home:/home/codex/.codex
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      # busybox wget: exits non-zero on a non-2xx response (verified), so this fails until
      # the listener is actually ready. The image installs nothing, so curl is not present.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8790/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  codex-home:

