ions ALL fail that constraint, do not keep enumerating inside it and do not switch to a looser interpretation of the answer slot: RELAX the constraint by one step instead (widen the year window, drop the distance bound, accept 'the 2000s' as '2000s-2010s'), re-run the enumeration, and log the relaxation in the matrix (`- Dropped: <constraint as worded> - relaxed after N failed enumerations; retried as <relaxed form>`). A constraint the corpus contradicts for every candidate is MIS-STATED, and stepping outward is how a mis-statement gets found.
